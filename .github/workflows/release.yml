name: release

# Builds glanced from a version tag and publishes it to PyPI, so that the wheel
# a lock file pins can be traced back to the exact commit it was built from.
#
# PyPI accepts the upload through Trusted Publishing (OIDC) — there is no API
# token anywhere — and records a signed attestation naming this workflow, this
# repository and the tagged commit. A second, GitHub-side provenance
# attestation lets anyone check a downloaded wheel offline:
#
#   gh attestation verify glanced-X.Y.Z-py3-none-any.whl --repo ayandexyz/glance-linux
#
# Actions are pinned to full commit SHAs. The build job installs nothing but
# packaging/build-requirements.lock, hash-checked, and builds without
# isolation, so no step of it resolves a package on its own.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Unpinned test dependencies stay in this job; none of it reaches the
      # build below, which starts from a fresh runner.
      - run: pip install -e '.[dev]' cryptography opencv-python-headless
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # A tag that disagrees with pyproject would publish a wheel whose version
      # points at a different commit than the one it was built from.
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      # Timestamps from the commit, not the clock, so a rebuild of the same tag
      # with the same toolchain reproduces the published wheel byte for byte.
      - name: Build
        run: |
          python -m venv /tmp/toolchain
          /tmp/toolchain/bin/pip install --require-hashes --only-binary :all: -r packaging/build-requirements.lock
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          /tmp/toolchain/bin/python -m build --no-isolation
          sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure the matching trusted publisher on PyPI: repository
    # ayandexyz/glance-linux, workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
